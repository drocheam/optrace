name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main    

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  make_doc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v7

    # needed for the x-server to work
    - name: Setup headless display
      uses: drocheam/setup-headless-display-action@main
      with:
        qt: true

    # generate documentation 
    - name: Run tox
      uses: lsst-sqre/run-tox@v1
      with:
        python-version: ${{ matrix.python-version }}
        tox-envs: "docs"
        tox-plugins: "tox-gh-actions"
        tox-posargs: "-v"
        cache-key-prefix: ".tox"
        
    - name: Create .nojekyll file
      run: touch ./docs/build/html/.nojekyll
    
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: './docs/build/html'

  # deployment job providing the artefact to github pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: make_doc
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
